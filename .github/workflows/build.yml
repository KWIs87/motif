name: Build Motif

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0 platform-tools"

      - uses: gradle/actions/setup-gradle@v4

      # Spotify's Android SDK ships as AARs on GitHub, not on Maven.
      - name: Fetch Spotify App Remote and Auth AARs
        run: |
          mkdir -p app/libs
          api=https://api.github.com/repos/spotify/android-sdk/releases/latest
          curl -sSL "$api" | grep browser_download_url | grep -E '\.aar"' | cut -d '"' -f 4 | while read -r url; do
            curl -sSL -o "app/libs/$(basename "$url")" "$url"
          done
          ls -la app/libs

      - name: Decode signing key
        env:
          KEYSTORE_B64: ${{ secrets.MOTIF_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/motif-release.jks"
            echo "Signing key present."
          else
            echo "No signing key secret; building unsigned."
          fi

      - name: Build release APK
        env:
          MOTIF_KEYSTORE_PATH: ${{ runner.temp }}/motif-release.jks
          MOTIF_KEYSTORE_PASSWORD: ${{ secrets.MOTIF_KEYSTORE_PASSWORD }}
          MOTIF_KEY_ALIAS: motif
          MOTIF_KEY_PASSWORD: ${{ secrets.MOTIF_KEYSTORE_PASSWORD }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          GENIUS_ACCESS_TOKEN: ${{ secrets.GENIUS_ACCESS_TOKEN }}
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
          GETSONGBPM_API_KEY: ${{ secrets.GETSONGBPM_API_KEY }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Name the APK
        id: name
        run: |
          v=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          out="motif-${v}-$(git rev-parse --short HEAD).apk"
          cp app/build/outputs/apk/release/app-release.apk "$out"
          echo "file=$out" >> "$GITHUB_OUTPUT"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: motif-apk
          path: ${{ steps.name.outputs.file }}

      # A rolling "latest" release so the phone always has one stable download link.
      - name: Publish to the latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          f="${{ steps.name.outputs.file }}"
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "Motif latest" --notes "Rolling build from main." --latest
          gh release upload latest "$f" --clobber
          cp "$f" motif-latest.apk
          gh release upload latest motif-latest.apk --clobber
          gh release edit latest --notes "Build ${{ steps.name.outputs.version }} from $(git rev-parse --short HEAD), $(date -u +%Y-%m-%dT%H:%MZ)."
